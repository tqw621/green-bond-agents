upstream streamlit {
    server app:8504;
}

# WebSocket 支持（Streamlit 会话必需）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ===== 如果还没配置 SSL，直接用 80 端口访问 =====
    # 注释下面这行即可：
    # return 301 https://$host$request_uri;

    client_max_body_size 100m;  # 支持大文件 CSV/Excel 上传

    # ===== HTTPS 配置（有证书后取消注释）=====
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ===== 可选：基础鉴权（取消注释启用）=====
    # auth_basic "Green Bond Simulator";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://streamlit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;   # 批量模拟 + LLM 调用耗时较长
        proxy_send_timeout 300s;
        proxy_buffering off;       # Streamlit WebSocket 必需关闭缓冲
    }

    # Streamlit 静态资源
    location /_stcore/ {
        proxy_pass http://streamlit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
